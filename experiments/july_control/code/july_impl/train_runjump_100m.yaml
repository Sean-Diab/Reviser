model:
  vocab_size: 50291
  d_model: 512
  n_heads: 8
  d_ff: 2048
  n_layers: 24
  dropout: 0.1
  attention_dropout: 0.1
  positional_encoding: rope
  tie_embeddings: true

data:
  resttraj_dir: <archive>/data/runjump_v0_prefix35_len100-350
  dataset_type: raining_bucketed
  max_seq_length: 512
  max_canvas_length: 512
  use_canvas: false
  min_traj_len: 100
  max_traj_len: 350
  bucket_size: 5
  seed: 123
  refresh_secs: 60

training:
  batch_size: 8
  gradient_accumulation: 4
  learning_rate: 2.0e-5
  min_learning_rate: 2.0e-6
  weight_decay: 0.1
  warmup_ratio: 0.02
  total_tokens: 2000000000
  num_workers: 2
  prefetch_factor: 2
  pin_memory: true
  log_every_steps: 20
  checkpoint_interval_secs: 1800
  inference_interval_secs: 900
  inference_n_examples: 2
  inference_max_new_actions: 120
  inference_fixed_prefix_length: 35

hardware:
  precision_type: float16
