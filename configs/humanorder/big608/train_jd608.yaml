# big608 (helper B, 2026-10-08; notes/big608-2026-10-08.md): the 100M classical Reviser from the released base
# (wrapped release, sha256 54dc8596...) on the delete recipe jd_n05_imm_m (configs/humanorder/overnight/jd_n05_imm_m.json)
# built over ALL 134 July text shards, trained to July@608M's tokens_processed (608,744,505 = July step 84,488).
# Copy of configs/humanorder/overnight/train/jd_n05_imm_m.yaml (itself the July/Q config with only resttraj_dir and the
# stop changed). Changed here: resttraj_dir, stop_at_tokens_processed, snapshot_at_steps (every 4,000 steps + July's
# 84,488). Unchanged: model, batch 8 x accum 4 (global 32 sequences), LR 2e-5 -> 2e-6 cosine over total_tokens 2e9
# (122,070 steps), warmup_ratio 0.02, seed 123 (data) / torch_seed 123, fp16, num_workers 2 (data order depends on it),
# inference test every 900 s, latest checkpoint every 1800 s, snapshots at July's checkpoint token counts.
# The prompt-lock flag (training.legality_mask, helper A) is added by big_lock.sh when the lock is ready.
# Original header of the copied config:
# Overnight data-variant arm 'jd_n05_imm_m' (notes/overnight-data-variants-2026-10-07.md; spec configs/humanorder/overnight/jd_n05_imm_m.json).
# Copy of configs/humanorder/train_q_textmatched_100m.yaml with ONLY data.resttraj_dir changed (the Q header below is
# kept verbatim; stop_at_tokens_processed 83,866,148, torch_seed 123 and everything else unchanged).
# Human-order Q arm (notes/human-order-plan-2026-10-07.md): a copy of
# experiments/july_control/configs/train_control_textmatched_100m.yaml with ONLY data.resttraj_dir and
# training.stop_at_tokens_processed changed (torch_seed 123 unchanged). Data: q_textmatched_v1 (run-and-jump
# order fitted to CoAuthor human writing order, data/humanorder/q_dials_v1.json) over the same 2,640,539 texts.
# PRIMARY control (Design M): original inverse-corruption trajectories of exactly the July texts
# Generated from code/july_impl/train_runjump_100m.yaml (sha256 in manifests/code_manifest.json);
# only data.resttraj_dir differs from the July config, plus the documented july_control additions.
model:
  vocab_size: 50291
  d_model: 512
  n_heads: 8
  d_ff: 2048
  n_layers: 24
  dropout: 0.1
  attention_dropout: 0.1
  positional_encoding: rope
  tie_embeddings: true

data:
  resttraj_dir: /root/rv2/hq/data/big_jd_n05_imm_m
  dataset_type: raining_bucketed
  max_seq_length: 512
  max_canvas_length: 512
  use_canvas: false
  min_traj_len: 100
  max_traj_len: 350
  bucket_size: 5
  seed: 123
  refresh_secs: 60

training:
  batch_size: 8
  gradient_accumulation: 4
  learning_rate: 2.0e-5
  min_learning_rate: 2.0e-6
  weight_decay: 0.1
  warmup_ratio: 0.02
  total_tokens: 2000000000
  num_workers: 2
  prefetch_factor: 2
  pin_memory: true
  log_every_steps: 20
  checkpoint_interval_secs: 1800
  inference_interval_secs: 900
  inference_n_examples: 2
  inference_max_new_actions: 120
  inference_fixed_prefix_length: 35
  # ---- july_control additions (require patches/pretrain_resttraj.patched.py; do not change the training math) ----
  stop_at_tokens_processed: 608744505      # July step 84,488 tokens_processed (July@608M)
  snapshot_at_steps: [4000, 8000, 12000, 16000, 20000, 24000, 28000, 32000, 36000, 40000, 44000, 48000, 52000, 56000, 60000, 64000, 68000, 72000, 76000, 80000, 84488]   # every 4,000 steps (+ July's last step)
  snapshot_at_tokens: [17757912, 83866148, 291313242]   # July ckpt token counts (steps 2467 / 11656 / 40445)
  checkpoint_write_step_snapshots: false   # time-based saves only refresh checkpoint_latest.pt (disk)
  torch_seed: 123                          # July left torch unseeded (dropout RNG); seeded here for re-runs

hardware:
  precision_type: float16
